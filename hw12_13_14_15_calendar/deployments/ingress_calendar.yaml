apiVersion: networking.k8s.io/v1
king: Ingress
metadata:
  name: {{ .Values.appIngressName }}
spec:
  ingressClassName: "nginx"
  rules:
    -  host: "calendar.com"
       http:
         paths:
           - path: /
             pathType: Prefix
             backend:
               service:
                 name: {{ .Values.appName }}
                 port:
                   number: 8888